<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meals</title>
<style>
:root{--bg:#F1F4F3;--card:#fff;--ink:#17201E;--mute:#8A9591;--line:#E6ECEA;--acc:#2C6B5F;--acc-t:#E1EFEB;--out:#B7791F;--out-t:#F7ECD6;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0F1514;--card:#172120;--ink:#E8EFED;--mute:#7F8C88;--line:#243230;--acc:#6CC3B0;--acc-t:#1C3A34;--out:#E0A63A;--out-t:#38301A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
body{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 18px);min-height:100dvh}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px 14px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
#wk{margin:2px 0 0;color:var(--mute);font-size:13px}
.actions{display:flex;gap:6px}
.ib{position:relative;width:40px;height:40px;border:0;border-radius:12px;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s}
.ib:active{transform:scale(.92)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--mute);border:2px solid var(--card);transition:background .3s}
#dot[data-s=ok]{background:var(--acc)}#dot[data-s=sync]{background:#E0A63A;animation:pulse 1s infinite}#dot[data-s=off]{background:#D2625A}#dot[data-s=none]{display:none}
@keyframes pulse{50%{opacity:.35}}
.head,.row{display:grid;grid-template-columns:56px 1fr 1fr}
.head b{font-size:13px;font-weight:600;color:var(--mute);text-align:center;padding:2px 0 8px}
.day{background:var(--card);border-radius:18px;margin-bottom:8px;overflow:hidden}
.boot .day{animation:in .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*50ms)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row{min-height:64px}.row+.row{border-top:1px solid var(--line)}
.lab{padding:0 0 0 14px;display:flex;flex-direction:column;justify-content:center}
.d{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.1}.d.today{color:var(--acc)}
.m{font-size:11px;color:var(--mute);margin-top:2px}
.slot{padding:4px 3px;min-width:0}.slot:last-child{padding-right:5px}
.chip{position:relative;height:100%;min-height:54px;border-radius:12px;padding:8px 30px 8px 9px;display:flex;align-items:center;font-size:14px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .25s,box-shadow .2s}
@media(hover:hover){.chip:hover{background:var(--bg)}}
.chip.out{background:var(--out-t);box-shadow:inset 3px 0 0 var(--out)}.chip.wfh{background:var(--acc-t)}
.txt{outline:0;width:100%;overflow-wrap:anywhere;min-height:1.3em}
.txt:empty::before{content:"Add meal";color:var(--mute);opacity:.55}
.txt[contenteditable=true]{user-select:text;-webkit-user-select:text;cursor:text}
.chip.editing{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--acc)}
.mk{position:absolute;right:3px;width:26px;height:26px;border:0;padding:0;background:none;color:var(--mute);opacity:.38;display:grid;place-items:center;border-radius:9px;cursor:pointer;transition:opacity .2s,color .2s}
.wb{top:1px}.ob{bottom:1px}
.mk svg{width:16px;height:16px;fill:transparent;transition:fill .25s}
.wfh .wb{opacity:1;color:var(--acc)}.wfh .wb svg{fill:color-mix(in srgb,var(--acc) 25%,transparent)}
.out .ob{opacity:1;color:var(--out)}.out .ob svg{fill:color-mix(in srgb,var(--out) 25%,transparent)}
.mk.pop svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.35)}}
.lifted{opacity:.25}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--card);box-shadow:0 14px 30px rgba(0,0,0,.2),0 0 0 1.5px var(--acc);transition:none}
.slot.target .chip{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--acc-t)}
.dragging{cursor:grabbing}.dragging *{cursor:grabbing!important}
footer{text-align:center;color:var(--mute);font-size:10px;opacity:.7;padding-top:8px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:60;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
#toast button{border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0 4px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:80}
.sh.on{transform:none}
.sh h2{margin:0 0 4px;font-size:19px}.sh p{margin:0 0 14px;color:var(--mute);font-size:13px}
.sh input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:0;transition:border-color .2s}
.sh input:focus{border-color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--acc);color:var(--card)}
#msg{margin-top:10px;font-size:13px;color:var(--mute);min-height:1em}
.ban{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--acc-t);border-radius:14px;padding:8px 8px 8px 14px;margin:0 0 12px;font-size:13px;animation:in .4s both}
.ban button{border:0;border-radius:10px;background:var(--acc);color:var(--card);font:inherit;font-weight:600;padding:8px 12px;cursor:pointer}
[hidden]{display:none!important}
.pill{display:flex;align-items:center;gap:6px;margin:6px auto 0;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:8px 14px;border-radius:12px;cursor:pointer;transition:background .2s}
.pill svg{width:16px;height:16px}.pill:active{background:var(--card)}
.day.new{animation:in .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*70ms)}
#tray{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -8px 28px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:55}
#tray.on{transform:none}
#tray .r{display:flex;gap:8px}
#tray input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:0;transition:border-color .2s}
#tray input:focus{border-color:var(--acc)}
#tray .btn{flex:none;min-width:0;padding:0 18px}
#tray small{display:block;color:var(--mute);font-size:12px;margin:8px 2px 0}
.filling{padding-bottom:140px}.filling .chip{cursor:pointer}.filling .mk{pointer-events:none;opacity:.2}
.ib.on{background:var(--acc);color:var(--card)}
.sh.tall{max-height:84dvh;overflow:auto}
.hw{border-radius:14px;background:var(--bg);margin-bottom:8px;overflow:hidden}
.hb{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;padding:14px;cursor:pointer;text-align:left}
.hb small{margin-left:8px;color:var(--mute);font-weight:400;font-size:12px}
.hb svg{transition:transform .3s}.hw.open .hb svg{transform:rotate(180deg)}
.hx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}.hw.open .hx{grid-template-rows:1fr}
.hi{overflow:hidden;min-height:0}
.hr{display:grid;grid-template-columns:50px 1fr 1fr;gap:6px;padding:7px 14px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.hr b{font-size:14px}.hr small{color:var(--mute);font-size:11px}
.hc{display:flex;gap:4px;align-items:center;min-height:18px}.hc span{min-width:0;overflow-wrap:anywhere}.hc svg{width:13px;height:13px;flex:none;color:var(--acc)}.hc i{display:contents}.hc .o svg{color:var(--out)}
.hcp{display:block;width:calc(100% - 28px);margin:8px 14px 14px}
.empty{color:var(--mute);font-size:14px;padding:20px 4px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body class="boot">
<header>
  <div><h1>Meals</h1><p id="wk"></p></div>
  <div class="actions">
    <button class="ib" id="histBtn" aria-label="History"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4.5H8M12 7.5V12l3 2"/></svg></button>
    <button class="ib" id="fillBtn" aria-label="Fill several boxes"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 5.5v-1a1 1 0 0 0-1-1h-10a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1"/></svg></button>
    <button class="ib" id="syncBtn" aria-label="Sync settings"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.75 4.75 0 0 1 0 9.5H7z"/></svg><i id="dot" data-s="none"></i></button>
    <button class="ib" id="newBtn" aria-label="Start new week"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  </div>
</header>
<div class="ban" id="ban" hidden><span id="bm"></span><button id="bgo"></button></div>
<main>
  <div class="head"><span></span><b id="n0">Tiffany</b><b id="n1">Eric</b></div>
  <div id="rows"></div>
  <button class="pill" id="wkBtn"></button>
</main>
<footer>v1.1</footer>
<div id="toast"><span id="tmsg"></span><button id="tact"></button></div>
<div id="scrim"></div>
<div id="sheet" class="sh">
  <h2>Sync with Google Sheets</h2>
  <p>Paste your Apps Script web app URL. Share the invite link so both phones use the same sheet.</p>
  <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <div class="btns"><button class="btn p" id="connect">Connect</button><button class="btn" id="invite">Copy invite link</button><button class="btn" id="disc">Disconnect</button></div>
  <div id="msg"></div>
</div>
<div id="hist" class="sh tall"><h2>History</h2><p id="hmsg"></p><div id="hlist"></div></div>
<div id="tray"><div class="r"><input id="stamp" list="meals" placeholder="Meal to fill with" autocomplete="off" enterkeyhint="done"><button class="btn p" id="fdone">Done</button></div><small>Tap boxes to fill them. Tap a filled box to clear it, or to copy its meal when the field is empty.</small></div>
<datalist id="meals"></datalist>
<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],K='meals.v1',SK='meals.sync',HK='meals.hist',PK='meals.pend';
const $=s=>document.querySelector(s),rows=$('#rows'),B=document.body,uid=()=>Math.random().toString(36).slice(2,9);
const item=()=>({id:uid(),t:'',w:false,o:false}),blank=()=>[0,1].map(()=>Array.from({length:14},item));
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const HOME=svg('<path d="M3.5 11 12 3.5l8.5 7.5M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"/>'),OUT=svg('<path d="M5 3v5a3 3 0 0 0 6 0V3M8 3v18M17 21V3c-2.2 1.2-3 3.8-3 7 0 1.7 1 2.5 3 2.5"/>'),CHEV=svg('<path d="m6 9 6 6 6-6"/>'),PLUS=svg('<path d="M12 5v14M5 12h14"/>'),MINUS=svg('<path d="M5 12h14"/>');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rd=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch{return d}};
/* dates (local, ISO yyyy-mm-dd) */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const targetMon=()=>{const d=new Date(),g=d.getDay();d.setDate(d.getDate()+(g===0?1:g===6?2:1-g));return iso(d)};
const F={day:'numeric',month:'short'};
const range=(ws,we)=>pd(ws).toLocaleDateString(undefined,F)+' – '+pd(addD(ws,we?6:4)).toLocaleDateString(undefined,F);
const nextWs=()=>{const n=addD(S.ws,7),t=targetMon();return t>n?t:n};
function mig(s){s.cells.forEach(c=>{while(c.length<14)c.push(item());c.forEach(i=>i.o=!!i.o)});s.ws=s.ws||targetMon();s.weekend=!!s.weekend;return s}
let S=mig(rd(K,null)||{updatedAt:0,names:['Tiffany','Eric'],cells:blank()}),hist=rd(HK,[]),pend=rd(PK,[]);
let API=localStorage[SK]||'';
const h=location.hash.match(/sync=([^&]+)/);if(h){API=decodeURIComponent(h[1]);localStorage[SK]=API;history.replaceState(null,'',location.pathname)}
const loc=id=>{for(const c of S.cells)for(const i of c)if(i.id===id)return i};
function commit(){S.updatedAt=Math.max(Date.now(),S.updatedAt+1);localStorage[K]=JSON.stringify(S);push()}

/* render */
const chip=it=>`<div class="chip${it.w?' wfh':''}${it.o?' out':''}" data-id="${it.id}"><div class="txt">${esc(it.t)}</div><button class="mk wb" data-k="w" aria-label="Working from home" aria-pressed="${it.w}">${HOME}</button><button class="mk ob" data-k="o" aria-label="Eating out" aria-pressed="${it.o}">${OUT}</button></div>`;
function render(nw){
  const n=S.weekend?7:5,td=iso(new Date());
  $('#n0').textContent=S.names[0];$('#n1').textContent=S.names[1];$('#wk').textContent=range(S.ws,S.weekend);
  rows.innerHTML=DAYS.slice(0,n).map((d,k)=>`<section class="day${nw&&k>4?' new':''}" style="--n:${nw?k-5:k}">`+[0,1].map(m=>{const i=k*2+m;
    return `<div class="row"><div class="lab">${m?'':`<div class="d${addD(S.ws,k)===td?' today':''}">${d}</div>`}<div class="m">${m?'Dinner':'Lunch'}</div></div>`+
    [0,1].map(c=>`<div class="slot" data-c="${c}" data-i="${i}">${chip(S.cells[c][i])}</div>`).join('')+'</div>'}).join('')+'</section>').join('');
  $('#wkBtn').innerHTML=(S.weekend?MINUS:PLUS)+'<span>'+(S.weekend?'Hide weekend':'Add Sat & Sun')+'</span>';
  const late=targetMon()>S.ws;$('#ban').hidden=!late;
  if(late){$('#bm').textContent='Plan is for '+range(S.ws,S.weekend);$('#bgo').textContent='Start '+range(nextWs(),S.weekend)}
}
const rects=()=>{const m={};rows.querySelectorAll('.chip').forEach(c=>m[c.dataset.id]=c.getBoundingClientRect());return m};
function flip(before){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  rows.querySelectorAll('.chip').forEach(c=>{const o=before[c.dataset.id];if(!o)return;const n=c.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
  if(Math.abs(dx)+Math.abs(dy)>1)c.animate([{transform:`translate(${dx}px,${dy}px)`,zIndex:5},{transform:'none',zIndex:5}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'})})}
$('#wkBtn').onclick=()=>{S.weekend=!S.weekend;commit();render(S.weekend)};

/* markers (WFH / eating out) and fill-stamping */
const stampEl=$('#stamp');
rows.addEventListener('click',e=>{const c0=e.target.closest('.chip');
  if(B.classList.contains('filling')){if(c0)stampTo(c0);return}
  const b=e.target.closest('.mk');if(!b)return;const c=b.closest('.chip'),it=loc(c.dataset.id),k=b.dataset.k;
  it[k]=!it[k];c.classList.toggle(k==='w'?'wfh':'out',it[k]);b.setAttribute('aria-pressed',it[k]);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');commit();navigator.vibrate&&navigator.vibrate(6)});
function stampTo(c){const it=loc(c.dataset.id),v=stampEl.value.trim();
  if(!v){if(it.t)stampEl.value=it.t;return}
  it.t=it.t===v?'':v;c.querySelector('.txt').textContent=it.t;
  c.animate([{transform:'scale(.93)'},{transform:'none'}],{duration:240,easing:'cubic-bezier(.3,1.5,.5,1)'});commit();navigator.vibrate&&navigator.vibrate(5)}
function fill(on){B.classList.toggle('filling',on);$('#tray').classList.toggle('on',on);$('#fillBtn').classList.toggle('on',on);
  if(on){const s=new Set();[...S.cells,...hist.flatMap(w=>w.cells)].forEach(c=>c.forEach(i=>i.t&&s.add(i.t)));
    $('#meals').innerHTML=[...s].slice(0,80).map(t=>`<option value="${esc(t)}">`).join('');stampEl.focus()}else stampEl.blur()}
$('#fillBtn').onclick=()=>fill(!B.classList.contains('filling'));$('#fdone').onclick=()=>fill(false);
stampEl.addEventListener('keydown',e=>{if(e.key==='Enter')stampEl.blur()});

/* edit */
function edit(c){const t=c.querySelector('.txt');t.contentEditable='true';c.classList.add('editing');t.focus();
  const r=document.createRange();r.selectNodeContents(t);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
rows.addEventListener('focusout',e=>{const t=e.target.closest('.txt');if(!t)return;const c=t.closest('.chip'),it=loc(c.dataset.id),v=t.innerText.replace(/\s+/g,' ').trim();
  t.contentEditable='false';c.classList.remove('editing');t.textContent=v;if(it.t!==v){it.t=v;commit()}});
rows.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});
rows.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text')||'').replace(/\s+/g,' '))});

/* drag */
let press=null,drag=null,timer=0;
rows.addEventListener('pointerdown',e=>{if(B.classList.contains('filling')||e.button||e.target.closest('.mk'))return;const c=e.target.closest('.chip');if(!c||e.target.isContentEditable)return;
  press={c,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,touch:e.pointerType!=='mouse'};
  if(press.touch)timer=setTimeout(startDrag,230)});
addEventListener('pointermove',e=>{if(!press)return;press.lx=e.clientX;press.ly=e.clientY;
  if(drag){place();return}
  if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>(press.touch?8:5)){if(press.touch){clearTimeout(timer);press=null}else startDrag()}});
addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
function startDrag(){if(!press||drag)return;const c=press.c,r=c.getBoundingClientRect(),g=c.cloneNode(true);
  g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);
  drag={c,g,ox:press.x-r.left,oy:press.y-r.top,src:c.parentElement,tgt:null};c.classList.add('lifted');B.classList.add('dragging');
  navigator.vibrate&&navigator.vibrate(10);place()}
function place(){const{g,ox,oy}=drag,x=press.lx,y=press.ly;g.style.transform=`translate(${x-ox}px,${y-oy}px) scale(1.04)`;
  const s=document.elementFromPoint(x,y)?.closest('.slot');const t=s&&s!==drag.src?s:null;
  if(t!==drag.tgt){drag.tgt?.classList.remove('target');t?.classList.add('target');drag.tgt=t}}
function end(cancel){clearTimeout(timer);if(!press)return;
  if(!drag){const c=press.c;press=null;if(!cancel)edit(c);return}
  const{c,g,src,tgt}=drag,gr=g.getBoundingClientRect();g.remove();c.classList.remove('lifted');tgt?.classList.remove('target');B.classList.remove('dragging');drag=null;press=null;
  if(cancel||!tgt)return;const a=+src.dataset.c,i=+src.dataset.i,b=+tgt.dataset.c,j=+tgt.dataset.i,before=rects();before[c.dataset.id]=gr;
  if(a===b){const arr=S.cells[a];arr.splice(j,0,arr.splice(i,1)[0])}else{[S.cells[a][i],S.cells[b][j]]=[S.cells[b][j],S.cells[a][i]]}
  commit();render();flip(before)}
addEventListener('pointerup',()=>end(false));addEventListener('pointercancel',()=>end(true));

/* toast */
let tt=0;function toast(m,a,fn){$('#tmsg').textContent=m;const b=$('#tact');b.textContent=a||'';b.style.display=a?'':'none';b.onclick=()=>{fn&&fn();$('#toast').classList.remove('on')};
  $('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),5000)}

/* history + new week */
function pack(){const n=S.weekend?14:10;return{ws:S.ws,weekend:S.weekend,names:S.names,cells:S.cells.map(c=>c.slice(0,n).map(({t,w,o})=>({t,w:!!w,o:!!o})))}}
const has=wk=>wk.cells.some(c=>c.some(i=>i.t||i.w||i.o));
function upsert(wk){hist=hist.filter(h=>h.ws!==wk.ws);hist.push(wk);hist.sort((a,b)=>a.ws<b.ws?1:-1);localStorage[HK]=JSON.stringify(hist)}
function newWeek(){const snap=JSON.stringify(S.cells),ows=S.ws,wk=pack(),had=has(wk);
  if(had){upsert(wk);pend=pend.filter(p=>p.ws!==wk.ws);pend.push(wk);localStorage[PK]=JSON.stringify(pend)}
  S.ws=nextWs();S.cells=blank();commit();render();flush();
  toast(had?'Week archived':'Week cleared','Undo',()=>{S.cells=JSON.parse(snap);S.ws=ows;commit();render()})}
$('#newBtn').onclick=newWeek;$('#bgo').onclick=newWeek;
let fl=false;async function flush(){if(!API||!pend.length||fl)return;fl=true;
  for(const wk of[...pend]){try{const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'archive',week:wk})})).json();
    if(r&&r.ok){pend=pend.filter(p=>p.ws!==wk.ws);localStorage[PK]=JSON.stringify(pend)}else break}catch{break}}fl=false}
function histBody(w){const n=w.weekend?7:5,cell=i=>`<div class="hc"><span>${esc(i.t||'')}</span>${i.w?HOME:''}${i.o?`<i class="o">${OUT}</i>`:''}</div>`;
  return `<div class="hr"><span></span><b>${esc(S.names[0])}</b><b>${esc(S.names[1])}</b></div>`+DAYS.slice(0,n).map((d,k)=>[0,1].map(m=>{const i=k*2+m;
    return `<div class="hr"><div>${m?'':`<b>${d}</b><br>`}<small>${m?'Dinner':'Lunch'}</small></div>${cell(w.cells[0][i]||{})}${cell(w.cells[1][i]||{})}</div>`}).join('')).join('')+'<button class="btn p hcp">Copy to this week</button>'}
function renderHist(){const L=hist.filter(w=>w.ws!==S.ws),el=$('#hlist');
  el.innerHTML=L.length?L.map(w=>`<div class="hw" data-ws="${w.ws}"><button class="hb"><span>${range(w.ws,w.weekend)}<small>${pd(w.ws).getFullYear()}</small></span>${CHEV}</button><div class="hx"><div class="hi"></div></div></div>`).join(''):'<div class="empty">Past weeks appear here when you start a new week.</div>'}
$('#hlist').addEventListener('click',e=>{const w=e.target.closest('.hw');if(!w)return;
  if(e.target.closest('.hcp'))return copyWeek(w.dataset.ws);
  if(e.target.closest('.hb')){const hi=w.querySelector('.hi');if(!hi.innerHTML)hi.innerHTML=histBody(hist.find(x=>x.ws===w.dataset.ws));w.classList.toggle('open')}});
function copyWeek(ws){const w=hist.find(x=>x.ws===ws),snap=JSON.stringify(S.cells),sw=S.weekend;
  S.cells=blank();w.cells.forEach((c,ci)=>c.forEach((i,k)=>Object.assign(S.cells[ci][k],{t:i.t,w:i.w,o:i.o})));S.weekend=S.weekend||w.weekend;
  commit();render();show(false);toast('Copied to this week','Undo',()=>{S.cells=JSON.parse(snap);S.weekend=sw;commit();render()})}
async function openHist(){show('hist');$('#hmsg').textContent='Tap a week to view it, or copy it into this week.';renderHist();if(!API)return;
  try{const r=await(await fetch(API+(API.includes('?')?'&':'?')+'a=archive',{cache:'no-store'})).json();
    if(r&&r.weeks){r.weeks.forEach(w=>{w.cells.forEach(c=>{while(c.length<14)c.push({t:'',w:false,o:false})});if(!pend.some(p=>p.ws===w.ws))upsert(w)});renderHist()}
    else $('#hmsg').textContent='Update the Apps Script to keep history in your sheet. Showing history saved on this phone.'}catch{}}
$('#histBtn').onclick=openHist;

/* sync (Google Apps Script web app, last-write-wins on updatedAt) */
const dot=$('#dot'),st=s=>dot.dataset.s=API?s:'none';
function adopt(r){S=mig(r);localStorage[K]=JSON.stringify(S);render()}
async function send(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(S)});const w=await r.json();if(w&&w.updatedAt>S.updatedAt)adopt(w)}
let pt=0,busy=false;
function push(){if(!API)return;st('sync');clearTimeout(pt);pt=setTimeout(async()=>{try{await send();st('ok')}catch{st('off')}},700)}
async function pull(){if(!API||busy||drag||document.activeElement?.isContentEditable||document.activeElement===stampEl)return;busy=true;st('sync');
  try{const r=await(await fetch(API,{cache:'no-store'})).json();
    if(r&&r.updatedAt>S.updatedAt)adopt(r);else if(!r||S.updatedAt>r.updatedAt)await send();st('ok');flush()}catch{st('off')}busy=false}
setInterval(()=>document.visibilityState==='visible'&&pull(),15000);
document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&pull());
addEventListener('online',pull);

/* sync sheet */
const sheet=$('#sheet'),scrim=$('#scrim'),msg=$('#msg'),hs=$('#hist');
function show(w){sheet.classList.toggle('on',w==='sync');hs.classList.toggle('on',w==='hist');scrim.classList.toggle('on',!!w);
  if(w==='sync'){$('#url').value=API;$('#invite').style.display=$('#disc').style.display=API?'':'none';msg.textContent=''}}
$('#syncBtn').onclick=()=>show('sync');scrim.onclick=()=>show(false);
$('#connect').onclick=async()=>{const u=$('#url').value.trim();if(!u)return;msg.textContent='Connecting…';API=u;localStorage[SK]=u;await pull();
  if(dot.dataset.s==='ok'){msg.textContent='';show(false);toast('Connected')}else msg.textContent='Could not reach that URL. Check the deployment is set to "Anyone".'};
$('#invite').onclick=async()=>{const l=location.origin+location.pathname+'#sync='+encodeURIComponent(API);try{await navigator.clipboard.writeText(l);msg.textContent='Invite link copied.'}catch{msg.textContent=l}};
$('#disc').onclick=()=>{API='';localStorage.removeItem(SK);st('none');show(false);toast('Sync turned off')};

render();st('ok');setTimeout(()=>B.classList.remove('boot'),900);pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
