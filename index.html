<script>
const DN=['Sat','Sun','Mon','Tue','Wed','Thu','Fri','Sat','Sun'],ROW=64,K='meals.v1',SK='meals.sync',HK='meals.hist',PK='meals.pend';

/* render */
const NOTE=svg('<path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14 3.5V8h5M10 12.5h6M10 16h4"/>');

let press=null,drag=null,rz=null,timer=0;

  const x=S.blocks.filter(o=>o!==b&&ovl({s,n:b.n,l},o));if(x.length!==1)return null;const o=x[0],mv=[[b,s,l],[o,b.s,b.l]],sv=mv.map(([p])=>[p.s,p.l]);

/* history + new week */

$('#hlist').addEventListener('click',e=>{const w=e.target.closest('.hw');if(!w)return;if(e.target.closest('.hcp'))return copyWeek(w.dataset.ws);

/* sync (Google Apps Script web app, last-write-wins on updatedAt) */
const dot=$('#dot'),st=s=>dot.dataset.s=API?s:'none';
